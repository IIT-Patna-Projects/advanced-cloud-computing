name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend linter (flake8)
        run: |
          flake8 backend/app backend/tests

      - name: Run backend tests (pytest)
        run: |
          pytest backend/tests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Run frontend linter (eslint)
        run: |
          npm --prefix frontend run lint

      - name: Build Tailwind CSS
        run: |
          npm --prefix frontend run build:css

      - name: Verify compiled CSS bundle exists
        run: |
          test -f frontend/public/css/styles.css
