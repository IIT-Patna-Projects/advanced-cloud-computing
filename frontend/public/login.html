<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to the ShopScale cloud benchmark platform.">
  <title>Sign In - ShopScale</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="flex flex-col min-h-full font-sans text-slate-800 antialiased">
  <!-- Navigation Header -->
  <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Brand Logo -->
        <div class="flex items-center space-x-3">
          <a href="./index.html" class="flex items-center space-x-2 text-slate-900 font-bold text-xl tracking-tight hover:text-emerald-600 transition-colors">
            <svg class="w-8 h-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span>ShopScale</span>
          </a>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
            Cloud Benchmark
          </span>
        </div>

        <!-- Navigation Links -->
        <nav class="flex items-center space-x-6">
          <a href="./index.html" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Catalog</a>
          <a href="./orders.html" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Orders</a>
          <a href="./cart.html" id="nav-cart-btn" class="relative inline-flex items-center p-2 text-slate-700 hover:text-emerald-600 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="8" cy="21" r="1"/>
              <circle cx="19" cy="21" r="1"/>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
            </svg>
            <span id="nav-cart-count" class="absolute -top-1 -right-1 px-2 py-0.5 text-xs font-bold bg-emerald-600 text-white rounded-full">0</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow flex items-center justify-center max-w-md mx-auto w-full px-4 py-12">
    <div class="bg-white rounded-xl border border-slate-200 p-8 shadow-sm w-full space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Sign In to ShopScale</h1>
        <p class="text-xs text-slate-500">Access your cloud allocations and load testing benchmarks.</p>
      </div>

      <!-- Demo Credentials Quick-Fill -->
      <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 flex items-center justify-between text-xs">
        <div>
          <span class="font-bold text-emerald-900 block">Demo Benchmark Account</span>
          <span class="text-emerald-700 font-mono text-[11px]">customer@example.com / SecurePassword123</span>
        </div>
        <button id="btn-demo-creds" type="button" class="px-2.5 py-1 text-xs font-semibold rounded bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
          Auto Fill
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="input-email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="input-email" required placeholder="user@domain.com" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label for="input-password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="input-password" required placeholder="••••••••" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div id="login-error-msg" class="hidden text-xs text-rose-600 font-medium"></div>

        <button type="submit" id="btn-submit-login" class="w-full py-2.5 px-4 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition-all text-center">
          Sign In
        </button>
      </form>

      <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
        <span>Do not have an account?</span>
        <a href="./register.html" class="font-semibold text-emerald-600 hover:text-emerald-700 ml-1">Create Account</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    <div>ShopScale Research Project - IIT Patna</div>
  </footer>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
