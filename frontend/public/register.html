<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an academic benchmark account on ShopScale.">
  <title>Create Account - ShopScale</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="flex flex-col min-h-full font-sans text-slate-800 antialiased">
  <!-- Navigation Header -->
  <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Brand Logo -->
        <div class="flex items-center space-x-3">
          <a href="./index.html" class="flex items-center space-x-2 text-slate-900 font-bold text-xl tracking-tight hover:text-emerald-600 transition-colors">
            <svg class="w-8 h-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <span>ShopScale</span>
          </a>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
            Cloud Benchmark
          </span>
        </div>

        <!-- Navigation Links -->
        <nav class="flex items-center space-x-6">
          <a href="./index.html" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Catalog</a>
          <a href="./orders.html" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Orders</a>
          <a href="./login.html" class="text-sm font-medium text-slate-700 hover:text-emerald-600 transition-colors">Sign In</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow flex items-center justify-center max-w-md mx-auto w-full px-4 py-12">
    <div class="bg-white rounded-xl border border-slate-200 p-8 shadow-sm w-full space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Create an Account</h1>
        <p class="text-xs text-slate-500">Register to provision cloud resources and simulate transactions.</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="space-y-4">
        <div>
          <label for="reg-fullname" class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
          <input type="text" id="reg-fullname" required placeholder="Dr. Jane Doe" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="reg-email" required placeholder="jane@domain.com" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label for="reg-org" class="block text-xs font-semibold text-slate-700 mb-1">Organization / Lab</label>
          <input type="text" id="reg-org" required placeholder="IIT Patna - ACC Lab" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label for="reg-password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="reg-password" required minlength="8" placeholder="At least 8 characters" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label for="reg-confirm-password" class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
          <input type="password" id="reg-confirm-password" required minlength="8" placeholder="Repeat password" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div id="register-error-msg" class="hidden text-xs text-rose-600 font-medium"></div>

        <button type="submit" id="btn-submit-register" class="w-full py-2.5 px-4 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition-all text-center">
          Create Benchmark Account
        </button>
      </form>

      <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
        <span>Already have an account?</span>
        <a href="./login.html" class="font-semibold text-emerald-600 hover:text-emerald-700 ml-1">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    <div>ShopScale Research Project - IIT Patna</div>
  </footer>

  <script type="module" src="./js/register.js"></script>
</body>
</html>
